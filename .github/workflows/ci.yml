name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # Build prima di test, come `npm run gate`: i test di pagina leggono
      # l'HTML costruito in `dist/` invece di rendere le pagine con la
      # container API, che sotto vitest trova le content collection vuote.
      # Con l'ordine inverso, su un checkout pulito `dist/` non esiste e
      # quei test falliscono.
      - run: npm run build
      - run: npm test
